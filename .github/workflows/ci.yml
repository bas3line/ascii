name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci runs the prepare script, which builds dist/ with tsc.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gen && git diff --exit-code src/pieces/index.ts src/library.ts
      # The kit: its tests, every example through the frame contract, and the docs' code against the build.
      - run: npm test
      - run: npm run kit:examples
      - run: npm run kit:docs
      # The markdown figures: every example through the frame contract (their tests run in npm test above).
      - run: npm run markdown:examples

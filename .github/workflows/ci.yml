name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the repo; a compromised step gets a token that cannot write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci runs the prepare script, which builds dist/ with tsc.
      - run: npm ci
      - run: npm run typecheck
      # gen also writes the agent skill (scripts/skill.ts), from the pieces and the docs: a new piece or a docs edit needs it run.
      - run: npm run gen && git diff --exit-code src/pieces/index.ts src/library.ts skills/
      # The kit: its tests, every example through the frame contract, and the docs' code against the build.
      - run: npm test
      - run: npm run kit:examples
      - run: npm run kit:docs

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci runs the prepare script, which builds dist/ with tsc.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gen && git diff --exit-code src/pieces/index.ts src/library.ts

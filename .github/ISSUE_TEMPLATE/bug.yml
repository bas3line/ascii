name: Bug
description: A piece, the tag, a component or the site does something wrong.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The piece, component or page.
      placeholder: night-coast, <Ascii> in Next.js, ascii.rest/donut
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and framework
      placeholder: Safari 19, Next.js 16
